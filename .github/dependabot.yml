version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 10
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /ops/cloudflare-keeper-scheduler
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    groups:
      cloudflare-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    groups:
      contract-tooling-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
