name: StudioNet Receipt Probe

on:
  workflow_dispatch:
    inputs:
      transaction_hash:
        description: Public StudioNet transaction hash to inspect
        required: true
        type: string

permissions:
  contents: read

jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate public transaction hash
        env:
          TRANSACTION_HASH: ${{ inputs.transaction_hash }}
        run: |
          if [[ ! "$TRANSACTION_HASH" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Expected an exact StudioNet transaction hash."
            exit 1
          fi
      - name: Select StudioNet
        run: ./node_modules/.bin/genlayer network set studionet
      - name: Create unfunded ephemeral read account
        run: |
          probe_password="$(openssl rand -hex 32)"
          echo "::add-mask::$probe_password"
          echo "PROBE_PASSWORD=$probe_password" >> "$GITHUB_ENV"
          ./node_modules/.bin/genlayer account create \
            --name receipt-probe \
            --password "$probe_password" \
            --overwrite >/dev/null
      - name: Print public finalized receipt
        env:
          TRANSACTION_HASH: ${{ inputs.transaction_hash }}
        run: |
          receipt_output="$(printf '%s\n' "$PROBE_PASSWORD" | \
            ./node_modules/.bin/genlayer receipt "$TRANSACTION_HASH" \
            --status FINALIZED \
            --retries 1 \
            --interval 5000 2>&1)"
          printf '%s\n' "$receipt_output"
          if ! grep -q 'status_name\|status:' <<<"$receipt_output"; then
            echo "::error::StudioNet did not return receipt lifecycle evidence."
            exit 1
          fi
