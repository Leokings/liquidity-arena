name: StudioNet Legacy V6 Drain

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studionet-liquidity-arena-writer
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    environment: studionet-keeper
    timeout-minutes: 55
    steps:
      - name: Require drain configuration
        shell: bash
        env:
          V6_CONTRACT_ADDRESS: ${{ vars.V6_CONTRACT_ADDRESS }}
          V7_KEEPER_KEYSTORE_B64: ${{ secrets.V7_KEEPER_KEYSTORE_B64 }}
          V7_KEEPER_KEYSTORE_PASSWORD: ${{ secrets.V7_KEEPER_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$V6_CONTRACT_ADDRESS" || -z "$V7_KEEPER_KEYSTORE_B64" || -z "$V7_KEEPER_KEYSTORE_PASSWORD" ]]; then
            echo "::error::StudioNet legacy V6 drain variables or limited-keeper secrets are missing."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Select StudioNet
        run: ./node_modules/.bin/genlayer network set studionet

      - name: Import encrypted keeper keystore
        shell: bash
        env:
          V7_KEEPER_KEYSTORE_B64: ${{ secrets.V7_KEEPER_KEYSTORE_B64 }}
          V7_KEEPER_KEYSTORE_PASSWORD: ${{ secrets.V7_KEEPER_KEYSTORE_PASSWORD }}
        run: |
          keeper_file="$RUNNER_TEMP/liquidity-arena-v7-limited-keeper.json"
          node -e '
            const fs = require("node:fs");
            const bytes = Buffer.from(process.env.V7_KEEPER_KEYSTORE_B64, "base64");
            const value = JSON.parse(bytes.toString("utf8"));
            if (!value.crypto && !value.Crypto) throw new Error("Keeper secret is not an encrypted keystore");
            fs.writeFileSync(process.argv[1], bytes, { mode: 0o600 });
          ' "$keeper_file"
          ./node_modules/.bin/genlayer account import \
            --name liquidity-arena-v7-limited-keeper \
            --keystore "$keeper_file" \
            --source-password "$V7_KEEPER_KEYSTORE_PASSWORD" \
            --password "$V7_KEEPER_KEYSTORE_PASSWORD" \
            --overwrite >/dev/null
          ./node_modules/.bin/genlayer account use liquidity-arena-v7-limited-keeper >/dev/null

      - name: Resolve or time out legacy StudioNet V6 epochs
        env:
          V6_CONTRACT_ADDRESS: ${{ vars.V6_CONTRACT_ADDRESS }}
          GENLAYER_KEYSTORE_PASSWORD: ${{ secrets.V7_KEEPER_KEYSTORE_PASSWORD }}
        run: node scripts/v6-drain.mjs --config scripts/examples/v6-keeper.example.json --execute

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/liquidity-arena-v7-limited-keeper.json"
