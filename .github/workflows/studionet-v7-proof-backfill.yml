name: StudioNet V7 Evidence Backfill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: studionet-keeper
    timeout-minutes: 15
    concurrency:
      group: studionet-liquidity-arena-writer
      cancel-in-progress: false
      queue: max
    steps:
      - name: Require history configuration
        shell: bash
        env:
          HISTORY_SYNC_URL: ${{ vars.HISTORY_SYNC_URL }}
          HISTORY_INGEST_SECRET: ${{ secrets.HISTORY_INGEST_SECRET }}
        run: |
          if [[ -z "$HISTORY_SYNC_URL" || -z "$HISTORY_INGEST_SECRET" ]]; then
            echo "::error::HISTORY_SYNC_URL or HISTORY_INGEST_SECRET is missing."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Leave a StudioNet quota window before batch A
        shell: bash
        run: sleep 90

      - name: Backfill deployment, epoch creation, and wagers
        env:
          HISTORY_SYNC_URL: ${{ vars.HISTORY_SYNC_URL }}
          HISTORY_INGEST_SECRET: ${{ secrets.HISTORY_INGEST_SECRET }}
        run: >-
          node scripts/history-sync.mjs
          --deployment v7
          --start-offset 0
          --max-epochs 1
          --no-known-proofs
          --idempotency-key v7-e19-proof-backfill-a-v1
          --proof v7:0x85ca7da5018aeac4955a9f10e035fe5013d520e5ea86ded43c89861ba96bc579:DEPLOYMENT
          --proof v7:0x48658624ab4923cc81b594863cca424f0f7a7026dc29f2fe71241297f50672cb:CREATE_EPOCH
          --proof v7:0x58f6907284ad6616ec9a4b030954ddcf257fd4bf99089be20245c46c53dbc4fa:WAGER
          --proof v7:0xa6284710314653508ab987b585892d134e3efbf96d78cd235b07e56dc8ce5831:WAGER
          --proof v7:0xc0d5401c97f87ef63a11adbb4a6db41d3f02ee2e927082847216eab48d142a19:WAGER
          --proof v7:0x80c1d3064ff30a1b070fbadd56598191873d881df02843d88a6dc000c3917e9c:WAGER

      - name: Leave a StudioNet quota window after batch A
        shell: bash
        run: sleep 90

      - name: Backfill resolution and first two claims
        env:
          HISTORY_SYNC_URL: ${{ vars.HISTORY_SYNC_URL }}
          HISTORY_INGEST_SECRET: ${{ secrets.HISTORY_INGEST_SECRET }}
        run: >-
          node scripts/history-sync.mjs
          --deployment v7
          --start-offset 0
          --max-epochs 1
          --no-known-proofs
          --idempotency-key v7-e19-proof-backfill-b-v1
          --proof v7:0xc2c86fdb37da9569e67eae00a15b6864ddab05364e92f4d6c0c4c75d6a4aab66:RESOLVE_EPOCH
          --proof v7:0x83a7a0069c2996d74e2277c652df05583225ef2a6af8e7f6c3672abb3682b2f5:CLAIM
          --proof v7:0x53adf85d1ad4b531807bc309744d72fe834d3500908c27c33e19c69aa68708e5:CLAIM

      - name: Leave a StudioNet quota window after batch B
        shell: bash
        run: sleep 90

      - name: Backfill final claim and fee withdrawal
        env:
          HISTORY_SYNC_URL: ${{ vars.HISTORY_SYNC_URL }}
          HISTORY_INGEST_SECRET: ${{ secrets.HISTORY_INGEST_SECRET }}
        run: >-
          node scripts/history-sync.mjs
          --deployment v7
          --start-offset 0
          --max-epochs 1
          --no-known-proofs
          --idempotency-key v7-e19-proof-backfill-c-v1
          --proof v7:0xf8a3197cfb168a9019b9a9ac0499a253a92c7e1e58762982b92caf27ca3c6031:CLAIM
          --proof v7:0x3df8d942bd9c5d699ee0d7816761ec5fd6264108d3a3e8bf3486c2c4f4fbb01f:FEE_WITHDRAWAL

      - name: Leave a StudioNet quota window after batch C
        if: always()
        shell: bash
        run: sleep 90
