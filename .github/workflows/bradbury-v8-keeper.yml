name: Bradbury V8 Keeper

on:
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bradbury-v8-liquidity-arena-writer
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.repository == 'Leokings/liquidity-arena' &&
      github.ref == 'refs/heads/main' &&
      github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: bradbury-v8-keeper
    timeout-minutes: 55
    steps:
      - name: Enforce protected main before secrets
        shell: bash
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$ACTUAL_REPOSITORY" != 'Leokings/liquidity-arena' || "$ACTUAL_REF" != 'refs/heads/main' || "$ACTUAL_REF_NAME" != 'main' ]]; then
            echo '::error::Bradbury V8 keeper secrets are restricted to protected main.'
            exit 1
          fi

      - name: Require V8 keeper configuration
        shell: bash
        env:
          V8_CONTRACT_ADDRESS: ${{ vars.V8_CONTRACT_ADDRESS }}
          V8_OWNER_ADDRESS: ${{ vars.V8_OWNER_ADDRESS }}
          V8_KEEPER_ADDRESS: ${{ vars.V8_KEEPER_ADDRESS }}
          V8_TREASURY_ADDRESS: ${{ vars.V8_TREASURY_ADDRESS }}
          V8_KEEPER_KEYSTORE_B64: ${{ secrets.V8_KEEPER_KEYSTORE_B64 }}
          V8_KEEPER_KEYSTORE_PASSWORD: ${{ secrets.V8_KEEPER_KEYSTORE_PASSWORD }}
          KEEPER_JOURNAL_URL: ${{ vars.KEEPER_JOURNAL_URL }}
          KEEPER_JOURNAL_SECRET: ${{ secrets.KEEPER_JOURNAL_SECRET }}
          HISTORY_SYNC_URL: ${{ vars.HISTORY_SYNC_URL }}
          HISTORY_INGEST_SECRET: ${{ secrets.HISTORY_INGEST_SECRET }}
        run: |
          for name in V8_CONTRACT_ADDRESS V8_OWNER_ADDRESS V8_KEEPER_ADDRESS V8_TREASURY_ADDRESS V8_KEEPER_KEYSTORE_B64 V8_KEEPER_KEYSTORE_PASSWORD KEEPER_JOURNAL_URL KEEPER_JOURNAL_SECRET HISTORY_SYNC_URL HISTORY_INGEST_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for the Bradbury V8 keeper."
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Select exact Bradbury testnet
        run: ./node_modules/.bin/genlayer network set testnet-bradbury

      - name: Import encrypted V8 keeper keystore
        shell: bash
        env:
          V8_KEEPER_KEYSTORE_B64: ${{ secrets.V8_KEEPER_KEYSTORE_B64 }}
          V8_KEEPER_KEYSTORE_PASSWORD: ${{ secrets.V8_KEEPER_KEYSTORE_PASSWORD }}
        run: |
          keeper_file="$RUNNER_TEMP/liquidity-arena-v8-keeper.json"
          node -e '
            const fs = require("node:fs");
            const bytes = Buffer.from(process.env.V8_KEEPER_KEYSTORE_B64, "base64");
            const value = JSON.parse(bytes.toString("utf8"));
            if (!value.crypto && !value.Crypto) throw new Error("Keeper secret is not an encrypted keystore");
            fs.writeFileSync(process.argv[1], bytes, { mode: 0o600 });
          ' "$keeper_file"
          ./node_modules/.bin/genlayer account import \
            --name liquidity-arena-v8-keeper \
            --keystore "$keeper_file" \
            --source-password "$V8_KEEPER_KEYSTORE_PASSWORD" \
            --password "$V8_KEEPER_KEYSTORE_PASSWORD" \
            --overwrite >/dev/null
          ./node_modules/.bin/genlayer account use liquidity-arena-v8-keeper >/dev/null

      - name: Reconcile Bradbury V8 epochs and payouts
        env:
          V8_CONTRACT_ADDRESS: ${{ vars.V8_CONTRACT_ADDRESS }}
          V8_OWNER_ADDRESS: ${{ vars.V8_OWNER_ADDRESS }}
          V8_KEEPER_ADDRESS: ${{ vars.V8_KEEPER_ADDRESS }}
          V8_TREASURY_ADDRESS: ${{ vars.V8_TREASURY_ADDRESS }}
          GENLAYER_KEYSTORE_PASSWORD: ${{ secrets.V8_KEEPER_KEYSTORE_PASSWORD }}
          KEEPER_JOURNAL_URL: ${{ vars.KEEPER_JOURNAL_URL }}
          KEEPER_JOURNAL_SECRET: ${{ secrets.KEEPER_JOURNAL_SECRET }}
        run: node scripts/v8-keeper.mjs --config scripts/examples/v8-keeper.example.json --execute

      - name: Synchronize bounded V8 epoch and payout history
        env:
          HISTORY_SYNC_URL: ${{ vars.HISTORY_SYNC_URL }}
          HISTORY_INGEST_SECRET: ${{ secrets.HISTORY_INGEST_SECRET }}
        run: >-
          node scripts/history-sync.mjs
          --deployment v8
          --max-epochs 3
          --no-known-proofs
          --idempotency-key "history-sync:v8:${{ github.run_id }}"

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/liquidity-arena-v8-keeper.json"
