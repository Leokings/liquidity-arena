name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-and-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the Vercel production Node.js major
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Node test suite
        run: npm test
      - name: Build the production bundle
        run: npm run build
      - name: Audit production and development dependencies
        run: npm audit
      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise desktop and mobile claim navigation in Chromium
        run: npm run test:e2e:ci
      - name: Install Cloudflare scheduler dependencies
        working-directory: ops/cloudflare-keeper-scheduler
        run: npm ci
      - name: Test Cloudflare scheduler
        working-directory: ops/cloudflare-keeper-scheduler
        run: npm test
      - name: Package-check Cloudflare scheduler
        working-directory: ops/cloudflare-keeper-scheduler
        run: npm run check
      - name: Audit Cloudflare scheduler dependencies
        working-directory: ops/cloudflare-keeper-scheduler
        run: npm audit
      - name: Upload failed browser evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  intelligent-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements-intelligent-contracts.txt
      - run: python -m pip install --requirement .github/requirements-intelligent-contracts.txt
      - run: python -X utf8 -m genvm_linter.cli check contracts/LiquidityArenaV6.py
      - run: python -X utf8 -m genvm_linter.cli check contracts/LiquidityArenaV7.py
      - run: python -X utf8 -m genvm_linter.cli check contracts/LiquidityArenaV8.py
      - run: python -X utf8 -m pytest tests/direct -q

  evm-payout-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the Vercel production Node.js major
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ops/evm-payout-test/package-lock.json
      - name: Install locked EVM test dependencies
        working-directory: ops/evm-payout-test
        run: npm ci
      - name: Compile the immutable factory and payout vault
        working-directory: ops/evm-payout-test
        run: npm run compile
      - name: Run adversarial EVM payout tests
        working-directory: ops/evm-payout-test
        run: npm test
      - name: Audit EVM authority, bytecode, and dependencies
        working-directory: ops/evm-payout-test
        run: npm run audit
