name: Cloudflare Keeper Scheduler CI

on:
  pull_request:
    paths:
      - '.github/workflows/cloudflare-keeper-scheduler-ci.yml'
      - 'ops/cloudflare-keeper-scheduler/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-keeper-scheduler-ci.yml'
      - 'ops/cloudflare-keeper-scheduler/**'

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ops/cloudflare-keeper-scheduler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ops/cloudflare-keeper-scheduler/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm audit
