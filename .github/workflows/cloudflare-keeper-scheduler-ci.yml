name: Cloudflare Keeper Scheduler CI

on:
  pull_request:
    paths:
      - '.github/workflows/cloudflare-keeper-scheduler-ci.yml'
      - 'ops/cloudflare-keeper-scheduler/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-keeper-scheduler-ci.yml'
      - 'ops/cloudflare-keeper-scheduler/**'

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ops/cloudflare-keeper-scheduler
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops/cloudflare-keeper-scheduler/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm audit --omit=dev
