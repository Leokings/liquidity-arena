name: StudioNet History Repair

on:
  workflow_dispatch:
    inputs:
      start_offset:
        description: Exact on-chain epoch index offset to repair
        required: true
        type: string
      max_epochs:
        description: Consecutive epochs to repair within the StudioNet quota
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: studionet-keeper
    timeout-minutes: 15
    concurrency:
      # Hold the writer lane so a bounded repair cannot overlap the dedicated
      # keeper signer. The before/after cooldowns also isolate adjacent history
      # and reconciliation requests from StudioNet's rolling read quota.
      group: studionet-liquidity-arena-writer
      cancel-in-progress: false
      queue: max
    steps:
      - name: Require history configuration
        shell: bash
        env:
          HISTORY_SYNC_URL: ${{ vars.HISTORY_SYNC_URL }}
          HISTORY_INGEST_SECRET: ${{ secrets.HISTORY_INGEST_SECRET }}
        run: |
          if [[ -z "$HISTORY_SYNC_URL" || -z "$HISTORY_INGEST_SECRET" ]]; then
            echo "::error::HISTORY_SYNC_URL or HISTORY_INGEST_SECRET is missing."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Leave a StudioNet quota window before repair
        shell: bash
        run: sleep 90

      - name: Repair bounded V7 epoch projection
        shell: bash
        env:
          HISTORY_SYNC_URL: ${{ vars.HISTORY_SYNC_URL }}
          HISTORY_INGEST_SECRET: ${{ secrets.HISTORY_INGEST_SECRET }}
          START_OFFSET: ${{ inputs.start_offset }}
          MAX_EPOCHS: ${{ inputs.max_epochs }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ ! "$START_OFFSET" =~ ^[0-9]{1,6}$ ]]; then
            echo "::error::start_offset must be an integer between 0 and 999999."
            exit 1
          fi
          if [[ ! "$MAX_EPOCHS" =~ ^[1-3]$ ]]; then
            echo "::error::max_epochs must be 1, 2, or 3."
            exit 1
          fi
          node scripts/history-sync.mjs \
            --deployment v7 \
            --start-offset "$START_OFFSET" \
            --max-epochs "$MAX_EPOCHS" \
            --no-known-proofs \
            --idempotency-key "history-repair:${RUN_ID}:${START_OFFSET}:${MAX_EPOCHS}"

      - name: Leave a StudioNet quota window after repair
        if: always()
        shell: bash
        run: sleep 90
