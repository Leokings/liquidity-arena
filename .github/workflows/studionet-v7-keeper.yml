name: StudioNet V7 Keeper

on:
  schedule:
    # StudioNet resolves no earlier than E+120s. The second run is a delayed
    # watchdog because GitHub schedules are best-effort, not an exact clock.
    - cron: '3,13 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: studionet-keeper
    timeout-minutes: 55
    concurrency:
      group: studionet-liquidity-arena-writer
      cancel-in-progress: false
    steps:
      - name: Require keeper configuration
        shell: bash
        env:
          V7_CONTRACT_ADDRESS: ${{ vars.V7_CONTRACT_ADDRESS }}
          V7_OWNER_ADDRESS: ${{ vars.V7_OWNER_ADDRESS }}
          V7_KEEPER_ADDRESS: ${{ vars.V7_KEEPER_ADDRESS }}
          V7_TREASURY_ADDRESS: ${{ vars.V7_TREASURY_ADDRESS }}
          V7_KEEPER_KEYSTORE_B64: ${{ secrets.V7_KEEPER_KEYSTORE_B64 }}
          V7_KEEPER_KEYSTORE_PASSWORD: ${{ secrets.V7_KEEPER_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$V7_CONTRACT_ADDRESS" || -z "$V7_OWNER_ADDRESS" || -z "$V7_KEEPER_ADDRESS" || -z "$V7_TREASURY_ADDRESS" || -z "$V7_KEEPER_KEYSTORE_B64" || -z "$V7_KEEPER_KEYSTORE_PASSWORD" ]]; then
            echo "::error::StudioNet V7 keeper variables or secrets are missing."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Select StudioNet
        run: ./node_modules/.bin/genlayer network set studionet

      - name: Import encrypted keeper keystore
        shell: bash
        env:
          V7_KEEPER_KEYSTORE_B64: ${{ secrets.V7_KEEPER_KEYSTORE_B64 }}
          V7_KEEPER_KEYSTORE_PASSWORD: ${{ secrets.V7_KEEPER_KEYSTORE_PASSWORD }}
        run: |
          keeper_file="$RUNNER_TEMP/liquidity-arena-v7-keeper.json"
          node -e '
            const fs = require("node:fs");
            const bytes = Buffer.from(process.env.V7_KEEPER_KEYSTORE_B64, "base64");
            const value = JSON.parse(bytes.toString("utf8"));
            if (!value.crypto && !value.Crypto) throw new Error("Keeper secret is not an encrypted keystore");
            fs.writeFileSync(process.argv[1], bytes, { mode: 0o600 });
          ' "$keeper_file"
          ./node_modules/.bin/genlayer account import \
            --name liquidity-arena-v7-keeper \
            --keystore "$keeper_file" \
            --source-password "$V7_KEEPER_KEYSTORE_PASSWORD" \
            --password "$V7_KEEPER_KEYSTORE_PASSWORD" \
            --overwrite >/dev/null
          ./node_modules/.bin/genlayer account use liquidity-arena-v7-keeper >/dev/null

      - name: Reconcile StudioNet V7 epochs
        env:
          V7_CONTRACT_ADDRESS: ${{ vars.V7_CONTRACT_ADDRESS }}
          V7_OWNER_ADDRESS: ${{ vars.V7_OWNER_ADDRESS }}
          V7_KEEPER_ADDRESS: ${{ vars.V7_KEEPER_ADDRESS }}
          V7_TREASURY_ADDRESS: ${{ vars.V7_TREASURY_ADDRESS }}
          GENLAYER_KEYSTORE_PASSWORD: ${{ secrets.V7_KEEPER_KEYSTORE_PASSWORD }}
        run: node scripts/v7-keeper.mjs --config scripts/examples/v7-keeper.example.json --execute

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/liquidity-arena-v7-keeper.json"

  history-sync:
    needs: reconcile
    runs-on: ubuntu-latest
    environment: studionet-keeper
    timeout-minutes: 15
    concurrency:
      group: studionet-liquidity-arena-history
      cancel-in-progress: false
    steps:
      - name: Check optional history configuration
        id: history-config
        shell: bash
        env:
          HISTORY_SYNC_URL: ${{ vars.HISTORY_SYNC_URL }}
          HISTORY_INGEST_SECRET: ${{ secrets.HISTORY_INGEST_SECRET }}
        run: |
          if [[ -z "$HISTORY_SYNC_URL" || -z "$HISTORY_INGEST_SECRET" ]]; then
            echo "::warning::History synchronization is disabled because HISTORY_SYNC_URL or HISTORY_INGEST_SECRET is missing."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.history-config.outputs.enabled == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.history-config.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        if: steps.history-config.outputs.enabled == 'true'
        run: npm ci

      - name: Synchronize durable V7 and legacy V6 history
        if: steps.history-config.outputs.enabled == 'true'
        env:
          HISTORY_SYNC_URL: ${{ vars.HISTORY_SYNC_URL }}
          HISTORY_INGEST_SECRET: ${{ secrets.HISTORY_INGEST_SECRET }}
        # One latest-resolvable epoch per deployment stays below StudioNet's
        # 30 gen_call/minute quota even when both epochs need five asset reads.
        # Bundled proof backfill is intentionally separate from recurring state
        # projection so it cannot consume the same provider quota window. The
        # run ID lets the delayed watchdog re-read changed state in the same UTC
        # hour while preserving idempotency for a retry of this exact run.
        run: node scripts/history-sync.mjs --deployment v7 --deployment v6 --max-epochs 2 --no-known-proofs --idempotency-key "history-sync:${{ github.run_id }}"
