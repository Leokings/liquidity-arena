name: StudioNet V7 Keeper

on:
  schedule:
    # GitHub's scheduler is heavily delayed near the top of the hour. One
    # state-reconciling run at :27 is sufficient and avoids relying on two
    # nominal triggers that GitHub repeatedly coalesced into one actual run.
    - cron: '27 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: studionet-keeper
    timeout-minutes: 55
    concurrency:
      group: studionet-liquidity-arena-writer
      cancel-in-progress: false
      queue: max
    steps:
      - name: Require keeper configuration
        shell: bash
        env:
          V7_CONTRACT_ADDRESS: ${{ vars.V7_CONTRACT_ADDRESS }}
          V7_OWNER_ADDRESS: ${{ vars.V7_OWNER_ADDRESS }}
          V7_KEEPER_ADDRESS: ${{ vars.V7_KEEPER_ADDRESS }}
          V7_TREASURY_ADDRESS: ${{ vars.V7_TREASURY_ADDRESS }}
          V7_KEEPER_KEYSTORE_B64: ${{ secrets.V7_KEEPER_KEYSTORE_B64 }}
          V7_KEEPER_KEYSTORE_PASSWORD: ${{ secrets.V7_KEEPER_KEYSTORE_PASSWORD }}
          KEEPER_JOURNAL_URL: ${{ vars.KEEPER_JOURNAL_URL }}
          KEEPER_JOURNAL_SECRET: ${{ secrets.KEEPER_JOURNAL_SECRET }}
        run: |
          if [[ -z "$V7_CONTRACT_ADDRESS" || -z "$V7_OWNER_ADDRESS" || -z "$V7_KEEPER_ADDRESS" || -z "$V7_TREASURY_ADDRESS" || -z "$V7_KEEPER_KEYSTORE_B64" || -z "$V7_KEEPER_KEYSTORE_PASSWORD" || -z "$KEEPER_JOURNAL_URL" || -z "$KEEPER_JOURNAL_SECRET" ]]; then
            echo "::error::StudioNet V7 keeper variables or secrets are missing."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Select StudioNet
        run: ./node_modules/.bin/genlayer network set studionet

      - name: Import encrypted keeper keystore
        shell: bash
        env:
          V7_KEEPER_KEYSTORE_B64: ${{ secrets.V7_KEEPER_KEYSTORE_B64 }}
          V7_KEEPER_KEYSTORE_PASSWORD: ${{ secrets.V7_KEEPER_KEYSTORE_PASSWORD }}
        run: |
          keeper_file="$RUNNER_TEMP/liquidity-arena-v7-keeper.json"
          node -e '
            const fs = require("node:fs");
            const bytes = Buffer.from(process.env.V7_KEEPER_KEYSTORE_B64, "base64");
            const value = JSON.parse(bytes.toString("utf8"));
            if (!value.crypto && !value.Crypto) throw new Error("Keeper secret is not an encrypted keystore");
            fs.writeFileSync(process.argv[1], bytes, { mode: 0o600 });
          ' "$keeper_file"
          ./node_modules/.bin/genlayer account import \
            --name liquidity-arena-v7-keeper \
            --keystore "$keeper_file" \
            --source-password "$V7_KEEPER_KEYSTORE_PASSWORD" \
            --password "$V7_KEEPER_KEYSTORE_PASSWORD" \
            --overwrite >/dev/null
          ./node_modules/.bin/genlayer account use liquidity-arena-v7-keeper >/dev/null

      - name: Reconcile StudioNet V7 epochs
        env:
          V7_CONTRACT_ADDRESS: ${{ vars.V7_CONTRACT_ADDRESS }}
          V7_OWNER_ADDRESS: ${{ vars.V7_OWNER_ADDRESS }}
          V7_KEEPER_ADDRESS: ${{ vars.V7_KEEPER_ADDRESS }}
          V7_TREASURY_ADDRESS: ${{ vars.V7_TREASURY_ADDRESS }}
          GENLAYER_KEYSTORE_PASSWORD: ${{ secrets.V7_KEEPER_KEYSTORE_PASSWORD }}
          KEEPER_JOURNAL_URL: ${{ vars.KEEPER_JOURNAL_URL }}
          KEEPER_JOURNAL_SECRET: ${{ secrets.KEEPER_JOURNAL_SECRET }}
        run: node scripts/v7-keeper.mjs --config scripts/examples/v7-keeper.example.json --execute

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/liquidity-arena-v7-keeper.json"

  history-sync:
    needs: reconcile
    runs-on: ubuntu-latest
    environment: studionet-keeper
    timeout-minutes: 15
    concurrency:
      # StudioNet enforces one rolling read bucket. Serialize projection with
      # every writer and manual repair/backfill job, not only other sync jobs.
      group: studionet-liquidity-arena-writer
      cancel-in-progress: false
      queue: max
    steps:
      - name: Require history configuration
        shell: bash
        env:
          HISTORY_SYNC_URL: ${{ vars.HISTORY_SYNC_URL }}
          HISTORY_INGEST_SECRET: ${{ secrets.HISTORY_INGEST_SECRET }}
        run: |
          if [[ -z "$HISTORY_SYNC_URL" || -z "$HISTORY_INGEST_SECRET" ]]; then
            echo "::error::HISTORY_SYNC_URL or HISTORY_INGEST_SECRET is missing."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Synchronize durable V7 history
        env:
          HISTORY_SYNC_URL: ${{ vars.HISTORY_SYNC_URL }}
          HISTORY_INGEST_SECRET: ${{ secrets.HISTORY_INGEST_SECRET }}
        # Three determined V7 epochs cost at most 24 StudioNet reads, below the
        # 30/minute provider limit. Re-reading a three-hour tail lets projection
        # recover a delayed/missed hourly sync. Retired V6 state is immutable and
        # is no longer scanned by recurring projection.
        run: node scripts/history-sync.mjs --deployment v7 --max-epochs 3 --no-known-proofs --idempotency-key "history-sync:${{ github.run_id }}"
